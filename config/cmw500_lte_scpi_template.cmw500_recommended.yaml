instrument:
  name: CMW500
  transport: socket
  default_port: 5025

lte:
  # LTE V1 per-cell order after the run-level preparation has completed:
  # DMODE -> Band -> Bandwidth -> Channel -> initial DL power -> BLER setup.
  # Run-level preparation (COM route / EATT / UE Report / MAXP+P-Max / RMC /
  # Security) is executed by core.lte_v1_workflow before the first cell.
  setup:
    - type: write
      command: "CONFigure:LTE:SIGN:PCC:DMODe {duplex_mode}"
    - type: write
      command: "CONFigure:LTE:SIGN:PCC:BAND OB{band_number}"
    - type: write
      command: "CONFigure:LTE:SIGN:CELL:BANDwidth:PCC:DL {bw}"
    - type: write
      command: "CONFigure:LTE:SIGN:RFSettings:CHANnel:DL {channel}"
    # Query steps always consume their response and are saved in command_trace.
    - type: query
      command: "CONFigure:LTE:SIGN:RFSettings:FREQuency:DL?"
    # Step 8: put DL at the configured maximum/start level before Cell ON.
    - type: write
      command: "CONFigure:LTE:SIGN:DL:RSEPre:LEVel {rx_level}"
    - type: write
      command: "CONFigure:LTE:SIGN:EBLer:REPetition SING"
    - type: write
      command: "CONFigure:LTE:SIGN:EBLer:SFRames {packet_count}"

  cell_on:
    - type: write
      command: "SOURce:LTE:SIGN:CELL:STATe ON"

  wait_attach:
    query: "SENSe:LTE:SIGN:RRCState?"
    parser: "regex"
    expected: "^CONN$"
    interval_sec: 0.2
    timeout_sec: 30.0
    fallback_success: false

  set_rx_level:
    - type: write
      command: "CONFigure:LTE:SIGN:DL:RSEPre:LEVel {rx_level}"

  measure_bler:
    start:
      - type: write
        command: "INITiate:LTE:SIGN:EBLer"
    state_query: "FETCh:LTE:SIGN:EBLer:STATe?"
    state_parser: "regex"
    state_done: "^RDY$"
    state_interval_sec: 0.05
    state_timeout_sec: 8.0
    stop:
      - type: write
        command: "STOP:LTE:SIGN:EBLer"
    query: "FETCh:LTE:SIGN:EBLer:RELative?"
    parser: "csv_index:3"
    fallback_simulation: false

  # RF safety confirmation. The CMW500 may need a short command-processing
  # window when switching the LTE signaling cell off, so issue OFF three times
  # and consume the intermediate state responses. Only the final state is an
  # assertion: if it is not explicitly OFF, the worker fails closed as
  # FAILED_UNSAFE.
  cell_off:
    - type: write
      command: "SOURce:LTE:SIGN:CELL:STATe OFF"
    - type: query
      command: "SOURce:LTE:SIGN:CELL:STATe?"
    - type: write
      command: "SOURce:LTE:SIGN:CELL:STATe OFF"
    - type: query
      command: "SOURce:LTE:SIGN:CELL:STATe?"
    - type: write
      command: "SOURce:LTE:SIGN:CELL:STATe OFF"
    - type: query_and_assert
      command: "SOURce:LTE:SIGN:CELL:STATe?"
      parser: "regex"
      expected: '^\s*OFF\s*$'

  # SYST:ERR? is diagnostic only. A queued SCPI error must not be confused
  # with an unconfirmed RF/Cell OFF state. The response is still consumed and
  # retained in command_trace for troubleshooting.
  cleanup:
    - type: query
      command: "SYST:ERR?"
