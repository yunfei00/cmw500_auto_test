instrument:
  name: CMW500
  transport: socket
  default_port: 5025

lte:
  # Per-cell configuration. CMW500-specific run-level settings such as COM
  # route, external attenuation, UE Report, P-Max, RMC and security are owned
  # by RealCMW500. Duplex mode is also selected by RealCMW500 before setup.
  setup:
    - type: write
      command: "CONFigure:LTE:SIGN:PCC:BAND OB{band_number}"
    - type: write
      command: "CONFigure:LTE:SIGN:CELL:BANDwidth:PCC:DL {bw}"
    - type: write
      command: "CONFigure:LTE:SIGN:RFSettings:CHANnel:DL {channel}"
    - type: query
      command: "CONFigure:LTE:SIGN:RFSettings:FREQuency:DL?"
    - type: write
      command: "CONFigure:LTE:SIGN:DL:RSEPre:LEVel {rx_level}"
    - type: write
      command: "CONFigure:LTE:SIGN:EBLer:REPetition SING"
    - type: write
      command: "CONFigure:LTE:SIGN:EBLer:SFRames {packet_count}"

  cell_on:
    - type: write
      command: "SOURce:LTE:SIGN:CELL:STATe ON"

  wait_attach:
    query: "SENSe:LTE:SIGN:RRCState?"
    parser: "regex"
    expected: "^CONN$"
    interval_sec: 0.2
    timeout_sec: 30.0
    fallback_success: false

  set_rx_level:
    - type: write
      command: "CONFigure:LTE:SIGN:DL:RSEPre:LEVel {rx_level}"

  measure_bler:
    # packet_count changes by scan phase: FAST normally uses 100, while
    # CONFIRM/FINE use the configured formal count (normally 1000). The
    # CMW500 keeps SFRames as instrument state, so it must be written before
    # every BLER INIT; setting it only during cell setup would leave every
    # subsequent measurement at the original 1000 packets.
    start:
      - type: write
        command: "CONFigure:LTE:SIGN:EBLer:SFRames {packet_count}"
      - type: write
        command: "INITiate:LTE:SIGN:EBLer"
    state_query: "FETCh:LTE:SIGN:EBLer:STATe?"
    state_parser: "regex"
    state_done: "^RDY$"
    state_interval_sec: 0.05
    state_timeout_sec: 8.0
    stop:
      - type: write
        command: "STOP:LTE:SIGN:EBLer"
    query: "FETCh:LTE:SIGN:EBLer:RELative?"
    parser: "csv_index:3"
    fallback_simulation: false

  # RF safety confirmation. Issue OFF and consume intermediate state responses.
  # The final response must explicitly report OFF. In YAML single-quoted
  # strings a regex backslash is already literal, so use one backslash here.
  cell_off:
    - type: write
      command: "SOURce:LTE:SIGN:CELL:STATe OFF"
    - type: query
      command: "SOURce:LTE:SIGN:CELL:STATe?"
    - type: write
      command: "SOURce:LTE:SIGN:CELL:STATe OFF"
    - type: query
      command: "SOURce:LTE:SIGN:CELL:STATe?"
    - type: write
      command: "SOURce:LTE:SIGN:CELL:STATe OFF"
    - type: query_and_assert
      command: "SOURce:LTE:SIGN:CELL:STATe?"
      parser: "regex"
      expected: '^\s*OFF\s*$'

  cleanup:
    - type: query
      command: "SYST:ERR?"
