[project]
name = "cmw500-auto-test"
version = "0.2.0.dev0"
description = "CMW500 automated test tool"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6==6.9.3",
    "openpyxl==3.1.5",
    "PyYAML==6.0.3",
    "PyVISA==1.16.2",
    "PyVISA-py==0.8.1",
    "psutil==7.2.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    { include-group = "build" },
]
build = [
    "pyinstaller==6.21.0",
    "pyinstaller-hooks-contrib==2026.6",
]

[tool.uv]
package = false
python-preference = "only-managed"
